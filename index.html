<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ONO Finder">
  <meta name="description" content="Aktuální ceny paliv Tank ONO, vývoj cen a nejbližší čerpací stanice.">
  <title>Tank ONO – ceny paliv a stanice</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint (no flash)
    try { const t = localStorage.getItem('tank-ono-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>

  <div id="map" aria-label="Mapa stanic"></div>

  <!-- Floating top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/><path d="M2 22h14"/><path d="M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8.5L19 5"/><path d="M6 8h6"/></svg>
      </span>
      <span class="brand-text">Tank <b>ONO</b></span>
    </div>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Přepnout světlý / tmavý režim">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <!-- Map controls -->
  <div class="map-ctrls">
    <button class="icon-btn fab" id="locate-btn" type="button" aria-label="Moje poloha">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn fab" id="fit-btn" type="button" aria-label="Zobrazit všechny stanice">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <!-- Sheet (bottom sheet on mobile, side panel on desktop) -->
  <section id="sheet" class="sheet" aria-label="Ceny a stanice">
    <div class="sheet-top" id="sheet-top">
      <div class="grabber" aria-hidden="true"></div>

      <!-- Station context: nearest / selected / prompt -->
      <div id="station-card" class="station-card"></div>

      <!-- Hero prices -->
      <div class="prices-head">
        <h2>Dnešní ceny <span class="muted">· všechny stanice</span></h2>
        <span id="validity" class="validity"></span>
      </div>
      <div id="hero-prices" class="hero-prices">
        <div class="hero-card skeleton"></div><div class="hero-card skeleton"></div><div class="hero-card skeleton"></div>
      </div>
    </div>

    <div class="sheet-body" id="sheet-body">
      <div class="seg" role="tablist">
        <button class="seg-btn active" role="tab" data-tab="trend" aria-selected="true">Vývoj cen</button>
        <button class="seg-btn" role="tab" data-tab="stations" aria-selected="false">Stanice <span id="st-count" class="seg-count"></span></button>
      </div>

      <!-- Trend tab -->
      <div class="tab" id="tab-trend">
        <div class="chart-card">
          <div class="chart-head">
            <div>
              <div class="chart-fuel" id="chart-fuel"></div>
              <div class="chart-value" id="chart-value">–</div>
              <div class="chart-sub" id="chart-sub">&nbsp;</div>
            </div>
            <button class="chip-toggle" id="compare-btn" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M3 21l6-4 4 2 8-5" opacity=".5"/></svg>
              Porovnat
            </button>
          </div>
          <div class="chart-wrap"><canvas id="chart" aria-label="Graf vývoje ceny"></canvas></div>
          <div class="ranges" role="tablist" id="ranges">
            <button data-range="7" >7 D</button>
            <button data-range="30" class="active">1 M</button>
            <button data-range="90">3 M</button>
            <button data-range="180">6 M</button>
          </div>
          <div class="stats" id="stats"></div>
        </div>

        <h3 class="section-h">Všechna paliva <span class="muted">· klepnutím zobrazíte graf</span></h3>
        <div id="fuel-list" class="fuel-list"></div>
        <p class="footnote" id="data-note"></p>
      </div>

      <!-- Stations tab -->
      <div class="tab hidden" id="tab-stations">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Hledat město nebo stanici" autocomplete="off" enterkeyhint="search">
        </label>
        <div id="station-list" class="station-list"></div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
